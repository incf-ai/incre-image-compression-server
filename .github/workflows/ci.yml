name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: native build tools (libaom, dav1d, libavif, libjxl)
        run: sudo apt-get update && sudo apt-get install -y cmake nasm meson ninja-build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # release: the encoders are far too slow unoptimised for the end-to-end tests
      - run: cargo test --workspace --release --locked
      - run: cargo deny check
      - name: THIRD_PARTY_LICENSES.md is current
        run: |
          cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md
          git diff --exit-code THIRD_PARTY_LICENSES.md
